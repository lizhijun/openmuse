name = "openmuse-api"
main = "src/index.ts"
compatibility_date = "2026-09-23"

# Set these to the public HTTPS endpoints before deployment.
[vars]
PUBLIC_API_URL = "https://muse-api.xiachat.com"
OPENMUSE_CHAT_PUBLIC_URL = "https://muse-chat.xiachat.com"
XIACHAT_IDENTITY_URL = "https://xiachat.com/api/auth/me"
ALLOWED_ORIGINS = "https://xiachat.com"
MODEL = "@cf/moonshotai/kimi-k2.6"
RUNTIME_MIGRATION_ENABLED = "false" # local candidate only; billing/wakeup/cloud acceptance pending

[ai]
binding = "AI"

[[routes]]
pattern = "muse-api.xiachat.com"
custom_domain = true

[[containers]]
class_name = "OpenMuseApiContainer"
image = "../../Dockerfile.api"
max_instances = 1

[[durable_objects.bindings]]
name = "API_CONTAINER"
class_name = "OpenMuseApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpenMuseApiContainer"]

[triggers]
crons = ["*/10 * * * *"]
